<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120"/>
      <stop offset="100%" stop-color="#050810"/>
    </linearGradient>
    <style>
      .text { font-family: 'Fira Code', 'Courier New', monospace; font-size: 15px; fill: #dbeafe; }
      .prompt { fill: #30A7F7; font-weight: bold; }
      .cmd { fill: #38bdf8; }
      .key { fill: #7DD3FC; font-weight: bold; }
      .string { fill: #93C5FD; }
      .bracket { fill: #e2e8f0; }
      
      .line {
        opacity: 0;
        animation: reveal 0.1s forwards;
      }
      @keyframes reveal {
        to { opacity: 1; }
      }
      .cursor {
        fill: #30A7F7;
        animation: blink 1s step-end infinite;
      }
      @keyframes blink {
        50% { opacity: 0; }
      }
    </style>
  </defs>
  
  <rect width="100%" height="100%" rx="10" fill="url(#bg)" stroke="#1e293b" stroke-width="2"/>
  
  <circle cx="20" cy="20" r="6" fill="#ef4444"/>
  <circle cx="40" cy="20" r="6" fill="#eab308"/>
  <circle cx="60" cy="20" r="6" fill="#22c55e"/>
  
  <g class="text" transform="translate(25, 55)">
    <text y="0" class="line" style="animation-delay: 0.50s;"><tspan class="prompt">nexlein@epitech:~$</tspan> <tspan class="cmd">cat profile.json</tspan></text>
    <text y="24" class="line" style="animation-delay: 0.65s;"><tspan class="bracket">{</tspan></text>
    <text y="48" class="line" style="animation-delay: 0.80s;">&#160;&#160;<tspan class="key">"name"</tspan>: <tspan class="string">"Nielsen"</tspan>,</text>
    <text y="72" class="line" style="animation-delay: 0.95s;">&#160;&#160;<tspan class="key">"role"</tspan>: <tspan class="string">"AI &amp; Software Engineer"</tspan>,</text>
    <text y="96" class="line" style="animation-delay: 1.10s;">&#160;&#160;<tspan class="key">"education"</tspan>: <tspan class="string">"Epitech"</tspan>,</text>
    <text y="120" class="line" style="animation-delay: 1.25s;">&#160;&#160;<tspan class="key">"mission"</tspan>: <tspan class="string">"I build AI systems that decide and learn."</tspan>,</text>
    <text y="144" class="line" style="animation-delay: 1.40s;">&#160;&#160;<tspan class="key">"stack"</tspan>: <tspan class="bracket">{</tspan></text>
    <text y="168" class="line" style="animation-delay: 1.55s;">&#160;&#160;&#160;&#160;<tspan class="key">"Languages"</tspan>: <tspan class="bracket">[</tspan><tspan class="string">"C"</tspan>, <tspan class="string">"C++"</tspan>, <tspan class="string">"C#"</tspan>, <tspan class="string">"Python"</tspan><tspan class="bracket">]</tspan>,</text>
    <text y="192" class="line" style="animation-delay: 1.70s;">&#160;&#160;&#160;&#160;<tspan class="key">"AI_Data"</tspan>:&#160;&#160;&#160;<tspan class="bracket">[</tspan><tspan class="string">"PyTorch"</tspan>, <tspan class="string">"scikit-learn"</tspan>, <tspan class="string">"Pandas"</tspan>, <tspan class="string">"Ollama"</tspan><tspan class="bracket">]</tspan>,</text>
    <text y="216" class="line" style="animation-delay: 1.85s;">&#160;&#160;&#160;&#160;<tspan class="key">"Frontend"</tspan>:&#160;&#160;<tspan class="bracket">[</tspan><tspan class="string">"React"</tspan>, <tspan class="string">"Next.js"</tspan>, <tspan class="string">"TailwindCSS"</tspan><tspan class="bracket">]</tspan>,</text>
    <text y="240" class="line" style="animation-delay: 2.00s;">&#160;&#160;&#160;&#160;<tspan class="key">"Backend"</tspan>:&#160;&#160;&#160;<tspan class="bracket">[</tspan><tspan class="string">"Supabase"</tspan>, <tspan class="string">"n8n"</tspan><tspan class="bracket">]</tspan>,</text>
    <text y="264" class="line" style="animation-delay: 2.15s;">&#160;&#160;&#160;&#160;<tspan class="key">"DevOps"</tspan>: &#160;&#160;&#160;<tspan class="bracket">[</tspan><tspan class="string">"Docker"</tspan>, <tspan class="string">"Jenkins"</tspan>, <tspan class="string">"Ansible"</tspan>, <tspan class="string">"GCP"</tspan><tspan class="bracket">]</tspan></text>
    <text y="288" class="line" style="animation-delay: 2.30s;">&#160;&#160;<tspan class="bracket">}</tspan>,</text>
    <text y="312" class="line" style="animation-delay: 2.45s;">&#160;&#160;<tspan class="key">"focus"</tspan>: <tspan class="bracket">[</tspan><tspan class="string">"Compound AI"</tspan>, <tspan class="string">"TDD"</tspan>, <tspan class="string">"Vibecoding"</tspan>, <tspan class="string">"AI-Assisted Coding"</tspan><tspan class="bracket">]</tspan>,</text>
    <text y="336" class="line" style="animation-delay: 2.60s;">&#160;&#160;<tspan class="key">"status"</tspan>: <tspan class="string">"Open to freelance projects"</tspan></text>
    <text y="360" class="line" style="animation-delay: 2.75s;"><tspan class="bracket">}</tspan></text>
    <text y="384" class="line" style="animation-delay: 3.20s;"><tspan class="prompt">nexlein@epitech:~$</tspan> <tspan class="cursor">█</tspan></text>
  </g>
</svg>